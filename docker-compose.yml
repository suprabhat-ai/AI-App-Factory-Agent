services:
  orchestrator:
    image: python:3.11-slim
    working_dir: /workspace/apps/orchestrator-backend
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"

  console:
    image: node:20-alpine
    working_dir: /workspace/apps/console-frontend
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./:/workspace
    environment:
      - NEXT_PUBLIC_ORCHESTRATOR_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - orchestrator
